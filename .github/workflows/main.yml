name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cinzel font (OFL, from Google Fonts)
        shell: bash
        run: |
          if [ ! -s Cinzel.ttf ]; then
            curl -L -sS -o Cinzel.ttf "https://github.com/google/fonts/raw/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf" || true
          fi
          [ -s Cinzel.ttf ] || rm -f Cinzel.ttf
          ls -la Cinzel.ttf || echo "Cinzel.ttf not available - the plugin will use the system serif font"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin files
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-${{ matrix.name }}
          path: |
            build/Saturator_artefacts/**/VST3/**
            build/Saturator_artefacts/**/AU/**
            build/Saturator_artefacts/**/Standalone/**
          if-no-files-found: error
